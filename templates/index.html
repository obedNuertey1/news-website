{% extends "base.html" %}

{% block body %}
{% include "navbar.html" %}
<div class="container">
    {% include "search.html" %}
    <h1 class="my-4 text-center">Welcome to the Times</h1>
    <div class="row">
        {% for article in articles %}
        <div class="col-md-6">
            <div class="card mb-4 news-article">
                {% if article.urlToImage %}
                <img class="card-img-top" src="{{ article.urlToImage }}" alt="{{ article.title }}">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">
                        <a href="{{article.url}}" target="_blank">{{article.title}}</a>
                    </h5>
                    <p class="card-text">{{article.description}}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
